name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build and Release macOS App
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Configure core_secrets.py for Sidecar
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ ! -f backend/core_secrets.py ]; then
            echo "Generating backend/core_secrets.py..."
            printf 'CLIENT_ID = "%s"\nCLIENT_SECRET = "%s"\nREDIRECT_URI = "http://localhost:14201/auth/callback"\n' \
              "$GOOGLE_CLIENT_ID" "$GOOGLE_CLIENT_SECRET" > backend/core_secrets.py
          fi

      - name: Build Python Sidecar
        run: |
          mkdir -p frontend/src-tauri/binaries
          cd backend
          pyinstaller --onefile main.py
          cd ..
          cp backend/dist/main frontend/src-tauri/binaries/main-aarch64-apple-darwin
          chmod +x frontend/src-tauri/binaries/main-aarch64-apple-darwin
          ls -lh frontend/src-tauri/binaries/main-aarch64-apple-darwin

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Build Tauri App and Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          tagName: ${{ github.ref_name }}
          releaseName: 'SmartClean ${{ github.ref_name }}'
          releaseBody: 'See the attached assets to download and install SmartClean for macOS.'
          releaseDraft: false
          prerelease: false
